[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "warpbuster-osm-manager"
version = "0.1.0.dev0"
description = "Deterministic local OpenStreetMap snapshot and cache manager for WarpBuster"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "WarpBuster contributors" },
]
dependencies = [
    "osmium>=4.3,<5",
]

[project.urls]
Repository = "https://github.com/zloynemec/warpbuster"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[project.scripts]
warpbuster-osm = "warpbuster_osm_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
warpbuster_osm_manager = ["py.typed"]

[tool.setuptools.data-files]
"share/warpbuster-osm-manager" = ["osm-manager.example.toml"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
markers = [
    "performance: bounded local performance regression",
    "network: optional live Overpass smoke test",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["osmium"]
ignore_missing_imports = true
