# WarpBuster Task 010B derived Valhalla graph cache.
# CLI --cache-dir overrides this value; WARPBUSTER_OSM_ROUTING_CACHE_DIR is used
# when neither CLI nor TOML specifies a directory.
[osm_routing]
cache_directory = "/absolute/path/to/osm-routing-cache"

# Immutable OSM Manager manifest and source ceilings.
maximum_manifest_bytes = 1048576
maximum_data_files = 64
maximum_total_source_bytes = 2147483648

# Streaming OSM normalization ceilings.
maximum_osm_objects = 5000000
maximum_total_node_references = 50000000
maximum_total_tag_bytes = 536870912
maximum_diagnostic_items = 100
maximum_output_pbf_bytes = 2147483648

# Derived Valhalla artifact ceilings.
maximum_tile_files = 250000
maximum_total_tile_bytes = 8589934592
build_timeout_seconds = 900.0

# Per-graph filesystem lock behavior.
cache_lock_timeout_seconds = 60.0
stale_lock_seconds = 1800.0
lock_poll_seconds = 0.1

# Hashing and conservative cache pruning.
io_chunk_bytes = 1048576
prune_minimum_age_seconds = 604800.0

# Task 010D audited request policy. These values do not affect graph identity.
snap_search_radius_m = 100.0
maximum_snap_distance_m = 30.0
equivalent_snap_separation_m = 3.0
snap_ambiguity_distance_delta_m = 10.0
maximum_snap_candidates = 64
maximum_reported_candidate_groups = 8
route_endpoint_tolerance_m = 5.0
maximum_route_distance_m = 250000.0
maximum_route_shape_points = 16000
maximum_route_edges = 16000
route_length_absolute_tolerance_m = 10.0
route_length_relative_tolerance = 0.01

# Task 010E request-time alternatives policy; no graph rebuild is required.
# Additional paths, excluding primary. CLI defaults to 0; runtime supports at most 2.
maximum_requested_alternates = 2
# Shared UTF-8 byte budget for route, traces and fallback metadata responses.
# Checked before parsing; not a C++ memory cap.
maximum_alternatives_response_bytes = 8388608
# Total decoded route/trace/metadata points and edges, including duplicates and failed attempts.
maximum_total_route_shape_points = 48000
maximum_total_route_edges = 48000
# Advisory only: diversity BELOW this ratio warns, but never removes a unique route.
minimum_diversity_ratio = 0.10
# Advisory only: candidate/primary length ABOVE this ratio warns, never filters.
detour_warning_ratio = 1.50

# Task 010G narrow single-edge direction recovery, no graph rebuild required.
# Additional trace attempts per route: 0 disables fallback, 1 permits one map_snap.
maximum_trace_fallback_attempts_per_route = 1
# Batched metadata requests per route (two route endpoints): 0 or 1.
maximum_trace_metadata_queries_per_route = 1
# Metres, graph endpoint projection only; route/trace sequences must match EXACTLY.
trace_edge_projection_tolerance_m = 0.25
# Fraction of edge; trace reports 3 decimal places, locate reports 5.
trace_percent_along_tolerance = 0.001

# Task 010H: optional approach sequence, start ambiguity only. 0 disables.
context_snapping_enabled = 1
# Records / seconds / metres; match Core collection limits when customizing.
context_maximum_points = 60
context_maximum_age_s = 60.0
context_maximum_length_m = 150.0
context_maximum_step_s = 5.0
context_minimum_points = 8
context_minimum_duration_s = 7.0
context_minimum_progress_m = 10.0
# Metres: absolute errors, total backward chainage and advantage over each rival.
context_maximum_median_error_m = 20.0
context_maximum_p90_error_m = 25.0
context_maximum_backtrack_m = 3.0
context_minimum_margin_m = 10.0
# Fraction of points supporting the winner, across full and recent windows.
context_minimum_support_ratio = 0.8
context_recent_points = 5
# Total local work across competitors. No additional locate calls.
context_maximum_groups = 8
context_maximum_vertices = 4096
context_maximum_projection_work = 245760
# Metres: near-equal local minima at distinct chainages refuse.
context_projection_tie_m = 0.25

# Task 010I: approximate candidate discovery; no graph rebuild required.
# Enabled per RouteAlternativesRequest; Core discovery opts in.
approximate_snap_distance_m = 100.0       # maximum anchor connector, metres
approximate_projection_merge_m = 20.0    # local projection chainage separation, metres
approximate_maximum_groups = 2           # road groups per anchor
approximate_maximum_pairs = 4            # native routing requests per gap
approximate_minimum_context_support = 0.6 # usable projection fraction for advisory ranking
