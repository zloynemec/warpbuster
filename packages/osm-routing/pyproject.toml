[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "warpbuster-osm-routing"
version = "0.1.0.dev0"
description = "Offline Valhalla graph cache for WarpBuster OSM snapshots"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "WarpBuster contributors" },
]
dependencies = [
    "osmium>=4.3,<5",
    "pyvalhalla>=3.8.3,<3.9",
]

[project.urls]
Repository = "https://github.com/zloynemec/warpbuster"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[project.scripts]
warpbuster-osm-route = "warpbuster_osm_routing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
warpbuster_osm_routing = ["py.typed"]

[tool.setuptools.data-files]
"share/warpbuster-osm-routing" = ["osm-routing.example.toml"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
markers = [
    "integration: local Valhalla build and routing smoke test",
    "performance: bounded local materialization performance regression",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["osmium", "valhalla"]
ignore_missing_imports = true
