[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "warpbuster"
dynamic = ["version"]
description = "Detect and repair physically impossible GNSS data in FIT activities"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "WarpBuster contributors" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "fitdecode>=0.11,<0.12",
]

[project.optional-dependencies]
dev = [
    "garmin-fit-sdk>=21.214,<22",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[project.scripts]
warpbuster = "warpbuster.cli:main"

[tool.setuptools.dynamic]
version = { attr = "warpbuster.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
warpbuster = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
markers = [
    "private: tests that require ignored private activity files",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["fitdecode"]
ignore_missing_imports = true
